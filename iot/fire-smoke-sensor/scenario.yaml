name: 'CSRMS fire/smoke - heated DHT22 still yields a full report cycle'
version: 1
author: 'CSRMS team'
steps:
  # Heat the room to 60 C, above the 50 C backend threshold. The MQ-2 slider
  # has no automation control, so temperature is the trigger we exercise.
  - set-control:
      part-id: dht
      control: temperature
      value: 60
  - wait-serial: 'connected.'
  # The fire sensor reports every 10 simulated seconds.
  - delay: 12s
  - wait-serial: 'Smoke'
